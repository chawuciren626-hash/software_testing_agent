name: 软件测试智能体 · 测试流水线

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r extensions/api_testing/requirements.txt
          pip install allure-pytest

      - name: 启动被测服务（如 mall-admin，按需替换为你的启动命令）
        run: echo "在此启动 localhost:8080 的被测后端（或使用 staging 地址）"

      - name: 运行接口自动化 + 产出 Allure 结果
        env:
          BASE_URL: ${{ secrets.BASE_URL || 'http://localhost:8080' }}
          APP_USERNAME: ${{ secrets.APP_USERNAME }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          pytest extensions/api_testing --alluredir=allure-results -v || true

      - name: 生成 Allure 报告
        uses: simple-elasticsearch/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history

      - name: 上传 Allure 报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-history

      - name: 聚合 HTML 总览
        run: python extensions/reporting/generate_report.py

      - name: 钉钉通知
        if: always()
        run: python extensions/reporting/notify_dingtalk.py
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}

      - name: 163 邮件通知
        if: always()
        run: python extensions/reporting/notify_email.py
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
